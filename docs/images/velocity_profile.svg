<svg xmlns="http://www.w3.org/2000/svg" width="680" height="362" viewBox="0 0 680 362" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Trapezoidal velocity profile — stepper motor / rotary table</title>
  <desc>Motor speed and table angular velocity vs time for one full table revolution. Acceleration 4 s, constant speed 45 s with 720 image triggers, deceleration 4 s. Total 53 s and 156 800 steps.</desc>
  <style>
    .lab{font-size:11px;fill:#5f5e5a}
    .lab-b{font-size:13px;font-weight:600;fill:#1f1f1d}
    .lab-t{font-size:11px;font-weight:600;fill:#0F6E56}
    .lab-t2{font-size:14px;font-weight:600;fill:#0F6E56}
    .gl{stroke:#d3d1c7;stroke-width:.5;stroke-dasharray:4,4;fill:none}
    .pd{stroke:#0F6E56;stroke-width:.75;stroke-dasharray:4,3;fill:none;opacity:.45}
    .tk{stroke:#0F6E56;stroke-width:1.5}
    .ax{stroke:#5f5e5a;stroke-width:.75}
  </style>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="362" rx="8" fill="#ffffff"/>

  <!-- Zone fills: accel / const / decel -->
  <polygon points="80,245 120,85 120,245" fill="#D3D1C7" opacity="0.55"/>
  <rect x="120" y="85" width="450" height="160" fill="#9FE1CB" opacity="0.3"/>
  <polygon points="570,85 610,245 570,245" fill="#D3D1C7" opacity="0.55"/>

  <!-- Horizontal grid (v = 1000 and 2000 steps/s; 160 px = 3200 steps/s) -->
  <line x1="80" y1="195" x2="610" y2="195" class="gl"/>
  <line x1="80" y1="145" x2="610" y2="145" class="gl"/>

  <!-- Vertical grid (t = 10, 20, 30, 40 s; 10 px = 1 s) -->
  <line x1="180" y1="85" x2="180" y2="245" class="gl"/>
  <line x1="280" y1="85" x2="280" y2="245" class="gl"/>
  <line x1="380" y1="85" x2="380" y2="245" class="gl"/>
  <line x1="480" y1="85" x2="480" y2="245" class="gl"/>

  <!-- Phase dividers at t = 4 s and t = 49 s -->
  <line x1="120" y1="30" x2="120" y2="305" class="pd"/>
  <line x1="570" y1="30" x2="570" y2="305" class="pd"/>

  <!-- Imaging window -->
  <line x1="124" y1="33" x2="566" y2="33" stroke="#0F6E56" stroke-width="1" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="345" y="26" text-anchor="middle" class="lab-t">Imaging window · 45 s · 720 triggers at every 0.5°</text>

  <!-- Velocity profile -->
  <path d="M 80 245 L 120 85 L 570 85 L 610 245" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Axes -->
  <line x1="80" y1="250" x2="80" y2="78" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrA)"/>
  <line x1="74" y1="245" x2="618" y2="245" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrA)"/>
  <line x1="610" y1="245" x2="610" y2="85" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="2,3"/>

  <!-- Left y axis: motor speed (steps/s) -->
  <line x1="76" y1="245" x2="84" y2="245" class="ax"/><text x="72" y="249" text-anchor="end" class="lab">0</text>
  <line x1="76" y1="195" x2="84" y2="195" class="ax"/><text x="72" y="199" text-anchor="end" class="lab">1000</text>
  <line x1="76" y1="145" x2="84" y2="145" class="ax"/><text x="72" y="149" text-anchor="end" class="lab">2000</text>
  <line x1="76" y1="85" x2="84" y2="85" class="ax"/><text x="72" y="89" text-anchor="end" class="lab">3200</text>
  <text x="84" y="74" class="lab">steps/s</text>

  <!-- Right y axis: table speed (°/s) -->
  <line x1="606" y1="245" x2="614" y2="245" class="ax"/><text x="618" y="249" class="lab">0°/s</text>
  <line x1="606" y1="195" x2="614" y2="195" class="ax"/><text x="618" y="199" class="lab">2.5°/s</text>
  <line x1="606" y1="145" x2="614" y2="145" class="ax"/><text x="618" y="149" class="lab">5°/s</text>
  <line x1="606" y1="85" x2="614" y2="85" class="ax"/><text x="618" y="89" class="lab">8°/s</text>
  <text x="618" y="74" class="lab">°/s</text>

  <!-- Image trigger ticks, every 5 s (representative; 720 in total) -->
  <line x1="120" y1="85" x2="120" y2="96" class="tk"/>
  <line x1="170" y1="85" x2="170" y2="96" class="tk"/>
  <line x1="220" y1="85" x2="220" y2="96" class="tk"/>
  <line x1="270" y1="85" x2="270" y2="96" class="tk"/>
  <line x1="320" y1="85" x2="320" y2="96" class="tk"/>
  <line x1="370" y1="85" x2="370" y2="96" class="tk"/>
  <line x1="420" y1="85" x2="420" y2="96" class="tk"/>
  <line x1="470" y1="85" x2="470" y2="96" class="tk"/>
  <line x1="520" y1="85" x2="520" y2="96" class="tk"/>
  <text x="345" y="110" text-anchor="middle" class="lab-t" style="font-size:9px">image trigger ticks (every 5 s shown)</text>

  <!-- Plateau annotation -->
  <text x="345" y="168" text-anchor="middle" class="lab-t2">v = 3 200 steps/s</text>
  <text x="345" y="185" text-anchor="middle" class="lab-t">ω = 8.0°/s · 1.333 rpm</text>

  <!-- Phase labels -->
  <text x="100" y="59" text-anchor="middle" class="lab-b">Acceleration</text>
  <line x1="100" y1="62" x2="100" y2="82" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="345" y="59" text-anchor="middle" class="lab-b">Constant speed</text>
  <line x1="345" y1="62" x2="345" y2="82" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="590" y="59" text-anchor="middle" class="lab-b">Deceleration</text>
  <line x1="590" y1="62" x2="590" y2="82" stroke="#5f5e5a" stroke-width="0.5"/>

  <!-- x axis ticks and labels -->
  <line x1="80" y1="241" x2="80" y2="249" class="ax"/><text x="80" y="261" text-anchor="middle" class="lab">0</text>
  <line x1="120" y1="241" x2="120" y2="249" class="ax"/><text x="120" y="261" text-anchor="middle" class="lab">4</text>
  <line x1="180" y1="241" x2="180" y2="249" class="ax"/><text x="180" y="261" text-anchor="middle" class="lab">10</text>
  <line x1="280" y1="241" x2="280" y2="249" class="ax"/><text x="280" y="261" text-anchor="middle" class="lab">20</text>
  <line x1="380" y1="241" x2="380" y2="249" class="ax"/><text x="380" y="261" text-anchor="middle" class="lab">30</text>
  <line x1="480" y1="241" x2="480" y2="249" class="ax"/><text x="480" y="261" text-anchor="middle" class="lab">40</text>
  <line x1="570" y1="241" x2="570" y2="249" class="ax"/><text x="570" y="261" text-anchor="middle" class="lab">49</text>
  <line x1="610" y1="241" x2="610" y2="249" class="ax"/><text x="610" y="261" text-anchor="middle" class="lab">53</text>
  <text x="345" y="277" text-anchor="middle" class="lab">Time (s)</text>

  <!-- Phase braces -->
  <path d="M80,291 L80,297 L120,297 L120,291" fill="none" stroke="#b4b2a9" stroke-width="0.75"/>
  <text x="100" y="310" text-anchor="middle" class="lab" style="font-size:10px">4 s · 6 400 steps</text>
  <path d="M120,291 L120,297 L570,297 L570,291" fill="none" stroke="#b4b2a9" stroke-width="0.75"/>
  <text x="345" y="310" text-anchor="middle" class="lab" style="font-size:10px">45 s · 144 000 steps · 720 images at 0.5° intervals</text>
  <path d="M570,291 L570,297 L610,297 L610,291" fill="none" stroke="#b4b2a9" stroke-width="0.75"/>
  <text x="590" y="310" text-anchor="middle" class="lab" style="font-size:10px">4 s · 6 400 steps</text>

  <!-- Serial protocol events -->
  <text x="122" y="327" class="lab-t" style="font-size:10px">IMAGE SHOOT START</text>
  <text x="568" y="327" text-anchor="end" class="lab-t" style="font-size:10px">IMAGE SHOOT STOP</text>

  <!-- Total -->
  <text x="345" y="348" text-anchor="middle" class="lab" style="font-size:10px">Total: 53 s · 156 800 motor steps · gear ratio 45:1 · microstepping 1/16</text>
</svg>
